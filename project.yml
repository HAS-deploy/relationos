name: RelationOS
options:
  bundleIdPrefix: com.relationos
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "NH2XFPC9KN"
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution"

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.15.0"

targets:
  RelationOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RelationOS
        excludes:
          - "**/.DS_Store"
    resources:
      - RelationOS/Resources/Assets.xcassets
      - RelationOS/Resources/PrivacyInfo.xcprivacy
      - RelationOS/Resources/Configuration.storekit
    dependencies:
      - target: RelationOSWidgets
        embed: true
      - package: PostHog
        product: PostHog
    info:
      path: RelationOS/Resources/Info.plist
      properties:
        CFBundleDisplayName: RelationOS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        PostHogKey: "phc_zsZ6KoWfgoUyVnJEjKi5KC6CuS66xnyQgradTRmqc52s"
        PostHogHost: "https://us.i.posthog.com"
        # Contacts import + interaction logging (2026-05-14). The first
        # string is shown verbatim in the permission prompt — keep it
        # honest and short. The schemes array gates canOpenURL for tel:
        # / sms: / mailto: used by LogInteractionSheet.
        NSContactsUsageDescription: "RelationOS imports the contacts you choose so you can track who you want to stay in touch with. We never read contacts in the background or send them off-device."
        LSApplicationQueriesSchemes:
          - tel
          - sms
          - mailto
        CFBundleDocumentTypes:
          - CFBundleTypeName: vCard
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.vcard
        # OAuth (Google People + Microsoft Graph). Values intentionally
        # blank — fill these before shipping OAuth imports. The matching
        # CFBundleURLTypes scheme must also be updated. The menu items
        # in ContactsListView are hidden when either side is blank, so
        # leaving them empty is safe.
        GoogleOAuthClientID: ""
        GoogleOAuthRedirectScheme: ""
        MicrosoftOAuthClientID: ""
        MicrosoftOAuthRedirectURI: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.relationos.app.google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.PLACEHOLDER
          - CFBundleURLName: com.relationos.app.microsoft-oauth
            CFBundleURLSchemes:
              - msauth.com.relationos.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.relationos.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: RelationOS/RelationOS.entitlements
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "RelationOS App Store"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual

  RelationOSWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RelationOSWidgets
        excludes:
          - "**/.DS_Store"
          - "Resources/**"
    resources:
      - RelationOSWidgets/Resources/Assets.xcassets
    info:
      path: RelationOSWidgets/Info.plist
      properties:
        CFBundleDisplayName: RelationOS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.relationos.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: RelationOSWidgets/RelationOSWidgets.entitlements
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "RelationOS Widgets App Store"
          CODE_SIGN_IDENTITY: "Apple Distribution"
          CODE_SIGN_STYLE: Manual

  RelationOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RelationOSTests
    dependencies:
      - target: RelationOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.relationos.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RelationOS:
    build:
      targets:
        RelationOS: all
        RelationOSWidgets: all
        RelationOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RelationOSTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
